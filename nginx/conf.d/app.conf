# HTTP-ONLY CONFIG — used during initial SSL certificate setup
# After running init-ssl.sh, this file gets replaced with app.ssl.conf
# The production server
server {
    listen 80;
    listen [::]:80;          # also listen on IPv6
    server_name vtucalc.in www.vtucalc.in;


    # If nginx serves it correctly → domain ownership verified → cert issued
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;   # return 404 if the challenge file doesn't exist
    }
    # Redirect everything else to HTTPS
    # 301 = permanent redirect, browser caches it
    location / {
        return 301 https://$host$request_uri;

    }
}

# Separate server block on localhost for Docker HEALTHCHECK
server {
    listen 80;
    server_name localhost;

    location /health-nginx {
        access_log off;            # don't pollute logs with health check hits
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
