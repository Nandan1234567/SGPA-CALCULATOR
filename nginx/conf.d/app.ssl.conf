# init-ssl.sh will cp this file over app.conf and reload nginx
# ── HTTP → HTTPS redirect (keep this from app.conf) ──────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vtucalc.in www.vtucalc.in;

    # Still need ACME location here for cert 90 days before RENEWAL.

    # If we remove this, renewals fail and cert expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────────
server {
    # listen 443 ssl: accept HTTPS connections.
    # ssl flag tells Nginx to handle TLS termination on this port.
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name vtucalc.in www.vtucalc.in;


    ssl_certificate     /etc/letsencrypt/live/vtucalc.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtucalc.in/privkey.pem;


    # All modern browsers (Chrome 70+, Firefox 63+) support TLS 1.2+.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cipher suites: which encryption algorithms to allow.

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;


    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;        # cached sessions valid for 1 day
    ssl_session_tickets off;       # session tickets have forward secrecy issues, disable


    ssl_stapling on;
    ssl_stapling_verify on;

    # Certbot creates these files during init-ssl.sh
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    # These headers are sent with EVERY response from this server block.
    # "always" = send even for error responses (4xx, 5xx).

    # HSTS: tell browser "always use HTTPS for this domain for 15768000 seconds (~6 months)".
    # After browser sees this once, it refuses HTTP connections to vtucalc.in
    # even before getting a redirect. Prevents SSL stripping attacks.
    # includeSubDomains: applies to api.vtucalc.in etc too (fine for your setup).
    # WARNING: once live, removing HSTS causes browsers to refuse HTTP for 6 months.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # X-Frame-Options SAMEORIGIN: prevents your site from being embedded in iframes

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression responses before sending.
    gzip on;


    # a gzipped response to a client that doesn't support gzip.
    gzip_vary on;


    gzip_proxied any;

    # Compression  Level 6
    gzip_comp_level 6;

    #compression types
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;


    client_max_body_size 2M;


    # Both backend and flask are on the same Docker network — should connect in  5s is generous for same-host networking.
    proxy_connect_timeout 5s;


    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ── API Proxy → ASP.NET Backend ──────────────────────────────────────────
    location /api/ {
        # Apply rate limit. zone=api = use the limit_req_zone defined in nginx.conf.
        # burst=20: allow a sudden spike of 20 extra requests above the rate limit.
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Forward request to ASP.NET container.
        proxy_pass http://backend:8080;

        # $host = the original Host header (vtucalc.in).
        # ASP.NET needs this to generate correct absolute URLs if needed.
        proxy_set_header Host $host;

        # $remote_addr = real user IP
        # ASP.NET can use this for logging, rate limiting, IP-based features.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── PDF Upload → Stricter Rate Limit ─────────────────────────────────────
    # More specific location for the PDF endpoint. Nginx uses longest-match prefix.
    # /api/sgpa/from-pdf is longer than /api/ so this block takes precedence.
    location /api/sgpa/from-pdf {
        limit_req zone=upload burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # ── Health Check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /health-nginx {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── React Static Files ────────────────────────────────────────────────────
    # root: where Nginx looks for static files.
    # The React build output was copied here in the nginx/Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    location / {


        # Falls back to index.html — React loads, React Router takes over, shows /results
        # Without this: direct URL navigation returns 404.
        try_files $uri $uri/ /index.html;
    }


    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        # expires 1y: set Cache-Control: max-age=31536000
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached — it's the app shell that loads the hashed assets.
    location = /index.html {
        # expires -1: set Cache-Control: no-cache (must revalidate every time)
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ACME renewal challenges — certbot needs to write here during renewal too
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
}
