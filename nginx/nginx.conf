# Main nginx config — replaces the default /etc/nginx/nginx.conf
user  nginx;
worker_processes  auto;   # auto = one worker per CPU core

#error and process id present in this files
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;                 # Linux-optimized I/O event model (faster than select/poll)
    multi_accept on;
}

http {
    # for render the css and js properly
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format — includes real client IP even behind Cloudflare
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

# here above # $remote_addr       - client IP (after real_ip processing = actual user IP)


    access_log  /var/log/nginx/access.log  main;

    sendfile        on;    # kernel-level file transfer, faster than read+write
    tcp_nopush      on;    # batch TCP packets — better throughput for large files
    tcp_nodelay     on;    # send small packets immediately — better for real-time
    keepalive_timeout  65; # keep connection alive for 65s (reduces TLS handshake overhead)
    server_tokens   off;   # don't expose nginx version in response headers (security)

    # ── Rate Limiting Zones ────────────────────────────────────────────────────
    # $binary_remote_addr = client IP (4 bytes for IPv4, compact)

    # General API zone — 10 requests per minute
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

    # PDF upload zone — 5 uploads per minute (stricter, PDF processing is expensive)
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # ── Cloudflare Real IP ─────────────────────────────────────────────────────
    # When Cloudflare proxies traffic, the connecting IP nginx sees is a Cloudflare IP
    # not the actual user's IP.

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Load all server block configs from conf.d/
    include /etc/nginx/conf.d/*.conf;
}
